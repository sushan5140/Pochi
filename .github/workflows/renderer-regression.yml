name: Renderer regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  locomotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check renderer/renderer.js
      - name: Locomotion and animation regression
        run: node --test tests/locomotion.test.js
