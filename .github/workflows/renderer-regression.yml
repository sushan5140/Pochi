name: Renderer regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  locomotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax and renderer regressions
        run: npm run check
