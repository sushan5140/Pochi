<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pochi — What I Remember</title>
  <link rel="stylesheet" href="memory.css" />
</head>
<body>
  <header>
    <h1>What Pochi Remembers</h1>
    <section class="transparency">
      <h2>What I do today</h2>
      <ul id="transparency-list"></ul>
    </section>
    <p class="subtitle">
      Stored locally on this computer only. Nothing here is ever sent anywhere.
    </p>
    <div class="actions">
      <button id="export-btn">Export to file…</button>
      <button id="delete-all-btn" class="danger">Delete everything</button>
    </div>
  </header>

  <main id="content">
    <p id="empty-state" class="empty" hidden>Nothing stored yet.</p>
  </main>

  <script src="memory.js"></script>
</body>
</html>
